<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- Background -->
  <rect width="960" height="540" fill="#FFFFFF"/>

  <!-- Left Panel: FP16 (4K) -->
  <g id="left-panel">
    <!-- Panel Background Frame -->
    <rect x="30" y="30" width="435" height="420" rx="16" fill="#F8F9FA" stroke="#E9ECEF" stroke-width="2"/>
    
    <!-- Title -->
    <rect x="50" y="45" width="395" height="45" rx="8" fill="#4C72B0"/>
    <text x="247" y="74" fill="#FFFFFF" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FP16 = 4K 사진</text>
    
    <!-- Scene Container (Vector / Crisp) -->
    <g transform="translate(50, 105)">
      <!-- Sky -->
      <rect x="0" y="0" width="395" height="330" rx="8" fill="#EBF3FB"/>
      
      <!-- Sun/Clouds -->
      <circle cx="340" cy="50" r="22" fill="#DD8452" opacity="0.8"/>
      
      <!-- Buildings -->
      <rect x="30" y="80" width="80" height="180" rx="2" fill="#8172B3"/>
      <rect x="45" y="100" width="18" height="25" fill="#FFFFFF" opacity="0.7"/>
      <rect x="77" y="100" width="18" height="25" fill="#FFFFFF" opacity="0.7"/>
      <rect x="45" y="140" width="18" height="25" fill="#FFFFFF" opacity="0.7"/>
      <rect x="77" y="140" width="18" height="25" fill="#FFFFFF" opacity="0.7"/>
      <rect x="45" y="180" width="18" height="25" fill="#FFFFFF" opacity="0.7"/>
      <rect x="77" y="180" width="18" height="25" fill="#FFFFFF" opacity="0.7"/>

      <rect x="120" y="120" width="110" height="140" rx="2" fill="#4C72B0"/>
      <rect x="135" y="140" width="22" height="20" fill="#EBF3FB"/>
      <rect x="164" y="140" width="22" height="20" fill="#EBF3FB"/>
      <rect x="193" y="140" width="22" height="20" fill="#EBF3FB"/>
      <rect x="135" y="175" width="22" height="20" fill="#EBF3FB"/>
      <rect x="164" y="175" width="22" height="20" fill="#EBF3FB"/>
      <rect x="193" y="175" width="22" height="20" fill="#EBF3FB"/>

      <rect x="240" y="60" width="70" height="200" rx="2" fill="#55A868"/>
      <rect x="255" y="80" width="40" height="15" fill="#FFFFFF" opacity="0.6"/>
      <rect x="255" y="110" width="40" height="15" fill="#FFFFFF" opacity="0.6"/>
      <rect x="255" y="140" width="40" height="15" fill="#FFFFFF" opacity="0.6"/>
      <rect x="255" y="170" width="40" height="15" fill="#FFFFFF" opacity="0.6"/>

      <!-- Trees -->
      <circle cx="20" cy="240" r="25" fill="#55A868"/>
      <rect x="17" y="250" width="6" height="25" fill="#8D6E63"/>

      <!-- Road -->
      <path d="M 0,260 L 395,260 L 395,330 L 0,330 Z" fill="#707B7C"/>
      <!-- Road Markings -->
      <line x1="20" y1="295" x2="80" y2="295" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="15,10"/>
      <line x1="120" y1="295" x2="380" y2="295" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="25,15"/>

      <!-- Road Sign (Crisp) -->
      <g transform="translate(220, 170)">
        <!-- Pole -->
        <rect x="62" y="45" width="6" height="50" fill="#4A4A4A"/>
        <!-- Sign Board -->
        <rect x="0" y="0" width="130" height="50" rx="6" fill="#55A868" stroke="#FFFFFF" stroke-width="2"/>
        <text x="65" y="32" fill="#FFFFFF" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">부산 400km</text>
      </g>
    </g>
  </g>

  <!-- Right Panel: INT4 (480p Mosaic) -->
  <g id="right-panel">
    <!-- Panel Background Frame -->
    <rect x="495" y="30" width="435" height="420" rx="16" fill="#F8F9FA" stroke="#E9ECEF" stroke-width="2"/>
    
    <!-- Title -->
    <rect x="515" y="45" width="395" height="45" rx="8" fill="#DD8452"/>
    <text x="712" y="74" fill="#FFFFFF" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">INT4 = 480p 사진</text>
    
    <!-- Scene Container (Pixelated Mosaic: 20x17 grid of ~19.7px rects) -->
    <g transform="translate(515, 105)">
      <!-- Clip path for rounded corners matching left panel -->
      <rect x="0" y="0" width="395" height="330" rx="8" fill="#EBF3FB"/>

      <!-- Pixel Grid (Simplified coarse pixel blocks) -->
      <!-- Sky Pixels (Rows 0 to 3) -->
      <rect x="0" y="0" width="40" height="40" fill="#E3EDF7"/>
      <rect x="40" y="0" width="40" height="40" fill="#EBF3FB"/>
      <rect x="80" y="0" width="40" height="40" fill="#E5EFF9"/>
      <rect x="120" y="0" width="40" height="40" fill="#EBF3FB"/>
      <rect x="160" y="0" width="40" height="40" fill="#E1ECF5"/>
      <rect x="200" y="0" width="40" height="40" fill="#EBF3FB"/>
      <rect x="240" y="0" width="40" height="40" fill="#E8F1FA"/>
      <rect x="280" y="0" width="40" height="40" fill="#F2A685"/>
      <rect x="320" y="0" width="45" height="40" fill="#E48B5D"/>
      <rect x="365" y="0" width="30" height="40" fill="#EBF3FB"/>

      <rect x="0" y="40" width="40" height="40" fill="#EBF3FB"/>
      <rect x="40" y="40" width="40" height="40" fill="#E1ECF5"/>
      <rect x="80" y="40" width="40" height="40" fill="#EBF3FB"/>
      <rect x="120" y="40" width="40" height="40" fill="#E5EFF9"/>
      <rect x="160" y="40" width="40" height="40" fill="#EBF3FB"/>
      <rect x="200" y="40" width="40" height="40" fill="#E3EDF7"/>
      <rect x="240" y="40" width="40" height="40" fill="#69B57C"/>
      <rect x="280" y="40" width="40" height="40" fill="#DC7D46"/>
      <rect x="320" y="40" width="45" height="40" fill="#DF814B"/>
      <rect x="365" y="40" width="30" height="40" fill="#E8F1FA"/>

      <!-- Mid Section - Sky & Buildings Pixelated (Rows 2-5) -->
      <rect x="0" y="80" width="40" height="40" fill="#EBF3FB"/>
      <rect x="40" y="80" width="40" height="40" fill="#8878B8"/>
      <rect x="80" y="80" width="40" height="40" fill="#7A6BA8"/>
      <rect x="120" y="80" width="40" height="40" fill="#E5EFF9"/>
      <rect x="160" y="80" width="40" height="40" fill="#EBF3FB"/>
      <rect x="200" y="80" width="40" height="40" fill="#E1ECF5"/>
      <rect x="240" y="80" width="40" height="40" fill="#50A163"/>
      <rect x="280" y="80" width="40" height="40" fill="#58AC6B"/>
      <rect x="320" y="80" width="45" height="40" fill="#52A465"/>
      <rect x="365" y="80" width="30" height="40" fill="#EBF3FB"/>

      <!-- Buildings Mid-level -->
      <rect x="0" y="120" width="40" height="40" fill="#E3EDF7"/>
      <rect x="40" y="120" width="40" height="40" fill="#B4A7D6"/>
      <rect x="80" y="120" width="40" height="40" fill="#7D6EA9"/>
      <rect x="120" y="120" width="40" height="40" fill="#476DA8"/>
      <rect x="160" y="120" width="40" height="40" fill="#557BB4"/>
      <rect x="200" y="120" width="40" height="40" fill="#496FA9"/>
      <rect x="240" y="120" width="40" height="40" fill="#99C2A0"/>
      <rect x="280" y="120" width="40" height="40" fill="#58AC6B"/>
      <rect x="320" y="120" width="45" height="40" fill="#E5EFF9"/>
      <rect x="365" y="120" width="30" height="40" fill="#EBF3FB"/>

      <!-- Buildings & Road Sign Level (Pixelated Sign) -->
      <rect x="0" y="160" width="40" height="40" fill="#EBF3FB"/>
      <rect x="40" y="160" width="40" height="40" fill="#7D6EA9"/>
      <rect x="80" y="160" width="40" height="40" fill="#BBB0DC"/>
      <rect x="120" y="160" width="40" height="40" fill="#476DA8"/>
      <rect x="160" y="160" width="40" height="40" fill="#CFD8E8"/>
      <rect x="200" y="160" width="40" height="40" fill="#4B71AC"/>

      <!-- Blurred/Pixelated Road Sign Area (220 to 350, y: 160 to 220) -->
      <rect x="240" y="160" width="30" height="30" fill="#52A364"/>
      <rect x="270" y="160" width="30" height="30" fill="#6BB97D"/>
      <rect x="300" y="160" width="30" height="30" fill="#50A163"/>
      <rect x="330" y="160" width="35" height="30" fill="#58AC6B"/>
      
      <rect x="240" y="190" width="30" height="30" fill="#5BB070"/>
      <!-- Unreadable Grey Blocks replacing text inside pixel sign -->
      <rect x="250" y="198" width="14" height="12" fill="#9EA7AA"/>
      <rect x="270" y="190" width="30" height="30" fill="#4FA062"/>
      <rect x="272" y="198" width="18" height="12" fill="#889296"/>
      <rect x="300" y="190" width="30" height="30" fill="#5AB06F"/>
      <rect x="302" y="198" width="14" height="12" fill="#9EA7AA"/>
      <rect x="330" y="190" width="35" height="30" fill="#4B9A5D"/>

      <rect x="365" y="160" width="30" height="40" fill="#EBF3FB"/>

      <!-- Lower Buildings & Trees (Rows) -->
      <rect x="0" y="200" width="40" height="40" fill="#66B278"/>
      <rect x="40" y="200" width="40" height="40" fill="#7D6EA9"/>
      <rect x="80" y="200" width="40" height="40" fill="#8878B8"/>
      <rect x="120" y="200" width="40" height="40" fill="#476DA8"/>
      <rect x="160" y="200" width="40" height="40" fill="#557BB4"/>
      <rect x="200" y="200" width="40" height="40" fill="#496FA9"/>
      <rect x="240" y="220" width="40" height="40" fill="#55A868"/>
      <!-- Sign Pole Pixel -->
      <rect x="280" y="220" width="20" height="40" fill="#616161"/>
      <rect x="300" y="220" width="20" height="40" fill="#EBF3FB"/>
      <rect x="320" y="200" width="45" height="40" fill="#50A163"/>
      <rect x="365" y="200" width="30" height="40" fill="#E8F1FA"/>

      <rect x="0" y="240" width="40" height="20" fill="#55A868"/>
      <rect x="40" y="240" width="40" height="20" fill="#8D6E63"/>
      <rect x="80" y="240" width="40" height="20" fill="#7D6EA9"/>
      <rect x="120" y="240" width="40" height="20" fill="#476DA8"/>
      <rect x="160" y="240" width="40" height="20" fill="#496FA9"/>
      <rect x="200" y="240" width="40" height="20" fill="#E1ECF5"/>
      <rect x="320" y="240" width="45" height="20" fill="#EBF3FB"/>
      <rect x="365" y="240" width="30" height="20" fill="#E1ECF5"/>

      <!-- Road Area Pixelated (y: 260 to 330) -->
      <rect x="0" y="260" width="50" height="35" fill="#6B7576"/>
      <rect x="50" y="260" width="50" height="35" fill="#788384"/>
      <rect x="100" y="260" width="50" height="35" fill="#6B7576"/>
      <rect x="150" y="260" width="50" height="35" fill="#737E7F"/>
      <rect x="200" y="260" width="50" height="35" fill="#687273"/>
      <rect x="250" y="260" width="50" height="35" fill="#788384"/>
      <rect x="300" y="260" width="50" height="35" fill="#6B7576"/>
      <rect x="350" y="260" width="45" height="35" fill="#737E7F"/>

      <!-- Road Markings Pixels -->
      <rect x="20" y="295" width="40" height="15" fill="#EAEAEA"/>
      <rect x="140" y="295" width="50" height="15" fill="#DFDFDF"/>
      <rect x="250" y="295" width="50" height="15" fill="#EEEEEE"/>

      <rect x="0" y="295" width="20" height="35" fill="#707B7C"/>
      <rect x="60" y="295" width="80" height="35" fill="#687273"/>
      <rect x="190" y="295" width="60" height="35" fill="#788384"/>
      <rect x="300" y="295" width="95" height="35" fill="#6B7576"/>
    </g>
  </g>

  <!-- Bottom Caption -->
  <g id="bottom-caption">
    <rect x="120" y="472" width="720" height="46" rx="10" fill="#F1F3F5" stroke="#DCE2E6" stroke-width="1.5"/>
    <text x="480" y="501" fill="#343A40" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">큰 형체는 둘 다 보이지만, 작은 글씨는 저화질에서 뭉개집니다</text>
  </g>
</svg>
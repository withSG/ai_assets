<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect width="960" height="540" fill="#FFFFFF"/>

  <!-- Main Grid Layout -->
  <!-- Header / Scene Dividers -->
  <line x1="480" y1="40" x2="480" y2="450" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Left Scene: TTP 없음 -->
  <!-- Title Left -->
  <rect x="140" y="35" width="200" height="40" rx="20" fill="#E2E8F0"/>
  <text x="240" y="61" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="bold" fill="#C44E52" text-anchor="middle">TTP 없음</text>

  <!-- Left Ground & Paths -->
  <path d="M 120 420 Q 240 380 240 320" fill="none" stroke="#CBD5E1" stroke-width="8" stroke-dasharray="6 6"/>
  <path d="M 360 420 Q 240 380 240 320" fill="none" stroke="#FCA5A5" stroke-width="8"/>
  
  <!-- Left Path Label -->
  <rect x="270" y="380" width="120" height="34" rx="8" fill="#FEE2E2"/>
  <text x="330" y="403" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" fill="#C44E52" text-anchor="middle">엉뚱한 해석</text>

  <!-- Left Robot -->
  <!-- Antenna -->
  <line x1="160" y1="180" x2="160" y2="160" stroke="#64748B" stroke-width="4"/>
  <circle cx="160" cy="155" r="8" fill="#C44E52"/>
  <!-- Head -->
  <rect x="110" y="180" width="100" height="80" rx="16" fill="#4C72B0"/>
  <!-- Eyes Behind Glasses -->
  <circle cx="135" cy="215" r="14" fill="#FFFFFF"/>
  <circle cx="185" cy="215" r="14" fill="#FFFFFF"/>
  <circle cx="135" cy="215" r="6" fill="#1E293B"/>
  <circle cx="185" cy="215" r="6" fill="#1E293B"/>
  <!-- Glasses Frame -->
  <circle cx="135" cy="215" r="18" fill="none" stroke="#334155" stroke-width="4"/>
  <circle cx="185" cy="215" r="18" fill="none" stroke="#334155" stroke-width="4"/>
  <line x1="153" y1="215" x2="167" y2="215" stroke="#334155" stroke-width="4"/>
  <!-- Foggy Lenses (Translucent Grey) -->
  <circle cx="135" cy="215" r="16" fill="#94A3B8" fill-opacity="0.65"/>
  <circle cx="185" cy="215" r="16" fill="#94A3B8" fill-opacity="0.65"/>
  <!-- Confused Mouth -->
  <path d="M 145 248 Q 160 240 175 248" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="120" y="270" width="80" height="70" rx="12" fill="#4C72B0"/>
  <rect x="135" y="285" width="50" height="40" rx="6" fill="#94A3B8"/>
  <!-- Arms & Legs -->
  <line x1="120" y1="290" x2="90" y2="320" stroke="#4C72B0" stroke-width="8" stroke-linecap="round"/>
  <line x1="200" y1="290" x2="230" y2="310" stroke="#4C72B0" stroke-width="8" stroke-linecap="round"/>
  <rect x="135" y="340" width="18" height="30" rx="6" fill="#334155"/>
  <rect x="167" y="340" width="18" height="30" rx="6" fill="#334155"/>

  <!-- Question Marks -->
  <text x="100" y="150" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="28" font-weight="bold" fill="#C44E52">?</text>
  <text x="205" y="155" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="24" font-weight="bold" fill="#DD8452">?</text>

  <!-- Crumpled Note Left -->
  <g transform="translate(235, 290) rotate(12)">
    <polygon points="0,0 95,-5 105,65 10,75 -5,35" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 10 15 L 85 10 M 15 35 L 75 40 M 20 55 L 65 50" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="48" y="42" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" fill="#334155" text-anchor="middle">그거 얼마나 걸려?</text>
  </g>


  <!-- Right Scene: TTP 적용 -->
  <!-- Title Right -->
  <rect x="620" y="35" width="200" height="40" rx="20" fill="#E2E8F0"/>
  <text x="720" y="61" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="bold" fill="#55A868" text-anchor="middle">TTP 적용</text>

  <!-- Right Ground & Path -->
  <path d="M 580 410 Q 700 390 840 370" fill="none" stroke="#55A868" stroke-width="12" stroke-linecap="round"/>

  <!-- Right Path Label -->
  <rect x="730" y="405" width="130" height="34" rx="8" fill="#DCFCE7"/>
  <text x="795" y="428" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" fill="#166534" text-anchor="middle">올바른 해석</text>

  <!-- Right Robot (Confident Walk) -->
  <!-- Antenna -->
  <line x1="610" y1="180" x2="610" y2="160" stroke="#64748B" stroke-width="4"/>
  <circle cx="610" cy="155" r="8" fill="#55A868"/>
  <!-- Head -->
  <rect x="560" y="180" width="100" height="80" rx="16" fill="#4C72B0"/>
  <!-- Eyes (Clear, Confident) -->
  <circle cx="585" cy="215" r="14" fill="#FFFFFF"/>
  <circle cx="635" cy="215" r="14" fill="#FFFFFF"/>
  <circle cx="588" cy="215" r="6" fill="#1E293B"/>
  <circle cx="638" cy="215" r="6" fill="#1E293B"/>
  <!-- Glasses Frame (Clear, No Fog) -->
  <circle cx="585" cy="215" r="18" fill="none" stroke="#334155" stroke-width="4"/>
  <circle cx="635" cy="215" r="18" fill="none" stroke="#334155" stroke-width="4"/>
  <line x1="603" y1="215" x2="617" y2="215" stroke="#334155" stroke-width="4"/>
  <!-- Happy Mouth -->
  <path d="M 595 242 Q 610 255 625 242" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="570" y="270" width="80" height="70" rx="12" fill="#4C72B0"/>
  <rect x="585" y="285" width="50" height="40" rx="6" fill="#64748B"/>
  <!-- Arms & Legs (Walking Pose) -->
  <line x1="570" y1="290" x2="545" y2="325" stroke="#4C72B0" stroke-width="8" stroke-linecap="round"/>
  <line x1="650" y1="290" x2="685" y2="275" stroke="#4C72B0" stroke-width="8" stroke-linecap="round"/>
  <line x1="590" y1="340" x2="575" y2="375" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <line x1="630" y1="340" x2="650" y2="370" stroke="#334155" stroke-width="8" stroke-linecap="round"/>

  <!-- Neat Checklist Card Right -->
  <g transform="translate(675, 145)">
    <!-- Card Shadow & Main Box -->
    <rect x="2" y="3" width="220" height="150" rx="10" fill="#CBD5E1"/>
    <rect x="0" y="0" width="220" height="150" rx="10" fill="#FFFFFF" stroke="#8172B3" stroke-width="3"/>
    <!-- Card Header Bar -->
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 210 0 A 10 10 0 0 1 220 10 L 220 30 L 0 30 Z" fill="#8172B3"/>
    <circle cx="15" cy="15" r="5" fill="#FCA5A5"/>
    <circle cx="30" cy="15" r="5" fill="#FEF08A"/>
    <circle cx="45" cy="15" r="5" fill="#86EFAC"/>
    <text x="110" y="21" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">TTP PROMPT</text>
    
    <!-- Checklist Items -->
    <!-- Line 1 -->
    <rect x="15" y="44" width="16" height="16" rx="4" fill="#55A868"/>
    <path d="M 18 52 L 22 56 L 28 47" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="58" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" fill="#1E293B">역할: 교통 전문가</text>

    <!-- Line 2 -->
    <rect x="15" y="77" width="16" height="16" rx="4" fill="#55A868"/>
    <path d="M 18 85 L 22 89 L 28 80" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="91" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" fill="#1E293B">규칙: 의도 자동 파악</text>

    <!-- Line 3 -->
    <rect x="15" y="110" width="16" height="16" rx="4" fill="#55A868"/>
    <path d="M 18 118 L 22 122 L 28 113" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="124" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" fill="#1E293B">형식: 약 X시간</text>
  </g>

  <!-- Bottom Banner / Caption -->
  <rect x="180" y="465" width="600" height="50" rx="25" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="480" y="497" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="22" font-weight="bold" fill="#334155" text-anchor="middle">"모델은 그대로, 프롬프트만 바뀌었습니다"</text>
</svg>
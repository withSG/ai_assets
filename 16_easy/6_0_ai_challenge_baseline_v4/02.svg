<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- Background -->
  <rect width="960" height="540" fill="#FFFFFF"/>

  <!-- Left Panel Background (train.csv) -->
  <rect x="35" y="30" width="425" height="425" rx="16" fill="#F8F9FA" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="35" y="30" width="425" height="55" rx="16" fill="#4C72B0"/>
  <!-- Top corner fix for header rectangle overlap -->
  <rect x="35" y="65" width="425" height="20" fill="#4C72B0"/>
  <text x="247" y="66" fill="#FFFFFF" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">train.csv = 채점된 시험지</text>

  <!-- Left Panel Content (Paper Sheet) -->
  <rect x="75" y="105" width="345" height="325" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- Question / Answer Rows -->
  <!-- Row A -->
  <rect x="105" y="130" width="285" height="55" rx="8" fill="#F1F5F9"/>
  <text x="130" y="164" fill="#334155" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold">a)</text>
  <rect x="165" y="152" width="180" height="10" rx="5" fill="#CBD5E1"/>

  <!-- Row B (Correct Answer) -->
  <rect x="105" y="200" width="285" height="55" rx="8" fill="#E6F4EA" stroke="#55A868" stroke-width="2"/>
  <text x="130" y="234" fill="#1E293B" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold">b)</text>
  <rect x="165" y="222" width="120" height="10" rx="5" fill="#A7F3D0"/>
  
  <!-- Green Checkmark -->
  <path d="M 305 227 L 318 240 L 345 210" fill="none" stroke="#55A868" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Stamp "정답 b" -->
  <g transform="translate(325, 185) rotate(-12)">
    <rect x="-10" y="-18" width="85" height="36" rx="6" fill="#FFE4E6" stroke="#C44E52" stroke-width="2"/>
    <text x="32" y="7" fill="#C44E52" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">정답 b</text>
  </g>

  <!-- Row C -->
  <rect x="105" y="270" width="285" height="55" rx="8" fill="#F1F5F9"/>
  <text x="130" y="304" fill="#334155" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold">c)</text>
  <rect x="165" y="292" width="200" height="10" rx="5" fill="#CBD5E1"/>

  <!-- Row D -->
  <rect x="105" y="340" width="285" height="55" rx="8" fill="#F1F5F9"/>
  <text x="130" y="374" fill="#334155" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold">d)</text>
  <rect x="165" y="362" width="150" height="10" rx="5" fill="#CBD5E1"/>


  <!-- Right Panel Background (dev.csv) -->
  <rect x="500" y="30" width="425" height="425" rx="16" fill="#F8F9FA" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="500" y="30" width="425" height="55" rx="16" fill="#DD8452"/>
  <!-- Top corner fix for header rectangle overlap -->
  <rect x="500" y="65" width="425" height="20" fill="#DD8452"/>
  <text x="712" y="66" fill="#FFFFFF" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">dev.csv = 5명이 답한 설문지</text>

  <!-- Right Panel Content (Paper Sheet) -->
  <rect x="540" y="105" width="345" height="325" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

  <!-- 5 People Icons -->
  <!-- Person 1 -->
  <g transform="translate(565, 125)">
    <circle cx="20" cy="14" r="10" fill="#8172B3"/>
    <path d="M 5 36 C 5 26 12 24 20 24 C 28 24 35 26 35 36 Z" fill="#8172B3"/>
  </g>
  <!-- Person 2 -->
  <g transform="translate(627, 125)">
    <circle cx="20" cy="14" r="10" fill="#8172B3"/>
    <path d="M 5 36 C 5 26 12 24 20 24 C 28 24 35 26 35 36 Z" fill="#8172B3"/>
  </g>
  <!-- Person 3 -->
  <g transform="translate(689, 125)">
    <circle cx="20" cy="14" r="10" fill="#8172B3"/>
    <path d="M 5 36 C 5 26 12 24 20 24 C 28 24 35 26 35 36 Z" fill="#8172B3"/>
  </g>
  <!-- Person 4 -->
  <g transform="translate(751, 125)">
    <circle cx="20" cy="14" r="10" fill="#8172B3"/>
    <path d="M 5 36 C 5 26 12 24 20 24 C 28 24 35 26 35 36 Z" fill="#8172B3"/>
  </g>
  <!-- Person 5 -->
  <g transform="translate(813, 125)">
    <circle cx="20" cy="14" r="10" fill="#8172B3"/>
    <path d="M 5 36 C 5 26 12 24 20 24 C 28 24 35 26 35 36 Z" fill="#8172B3"/>
  </g>

  <!-- 5 Answer Cells -->
  <!-- Cell 1: a -->
  <rect x="560" y="170" width="50" height="50" rx="8" fill="#EDF2F7" stroke="#CBD5E1" stroke-width="2"/>
  <text x="585" y="202" fill="#1E293B" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">a</text>

  <!-- Cell 2: b -->
  <rect x="622" y="170" width="50" height="50" rx="8" fill="#EDF2F7" stroke="#CBD5E1" stroke-width="2"/>
  <text x="647" y="202" fill="#1E293B" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">b</text>

  <!-- Cell 3: a -->
  <rect x="684" y="170" width="50" height="50" rx="8" fill="#EDF2F7" stroke="#CBD5E1" stroke-width="2"/>
  <text x="709" y="202" fill="#1E293B" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">a</text>

  <!-- Cell 4: a -->
  <rect x="746" y="170" width="50" height="50" rx="8" fill="#EDF2F7" stroke="#CBD5E1" stroke-width="2"/>
  <text x="771" y="202" fill="#1E293B" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">a</text>

  <!-- Cell 5: b -->
  <rect x="808" y="170" width="50" height="50" rx="8" fill="#EDF2F7" stroke="#CBD5E1" stroke-width="2"/>
  <text x="833" y="202" fill="#1E293B" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">b</text>

  <!-- Big Question Mark Zone -->
  <rect x="560" y="235" width="298" height="110" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="709" y="312" fill="#DD8452" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="72" font-weight="bold" text-anchor="middle">?</text>

  <!-- Caption Box inside Right Panel -->
  <rect x="560" y="358" width="298" height="55" rx="8" fill="#FFFBEB"/>
  <text x="709" y="392" fill="#B45309" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">다수결 = a ? 만장일치는 0건</text>


  <!-- Bottom Caption Banner (Across both panels) -->
  <rect x="35" y="472" width="890" height="50" rx="10" fill="#334155"/>
  <text x="480" y="504" fill="#FFFFFF" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">검증(채점)은 train.csv 를 떼어내서, dev.csv 는 '사람도 헷갈리는 문제' 연구용</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- Background -->
  <rect width="960" height="540" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="480" y="45" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="24" font-weight="bold" fill="#2B2D42" text-anchor="middle">모델이 실제로 보는 입력 (chat template)</text>

  <!-- ROW 1: System (Light Blue Theme) -->
  <g id="row-system">
    <!-- Row Label -->
    <rect x="30" y="80" width="85" height="30" rx="6" fill="#4C72B0"/>
    <text x="72" y="101" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">System</text>

    <!-- Blocks -->
    <!-- block 1: &lt;|im_start|&gt; -->
    <rect x="30" y="120" width="135" height="50" rx="8" fill="#D0E1F9" stroke="#4C72B0" stroke-width="2"/>
    <text x="97" y="151" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" fill="#2B2D42" text-anchor="middle">&lt;|im_start|&gt;</text>

    <!-- block 2: system -->
    <rect x="175" y="120" width="100" height="50" rx="8" fill="#A1C4FD" stroke="#4C72B0" stroke-width="2"/>
    <text x="225" y="151" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" fill="#1A365D" text-anchor="middle">system</text>

    <!-- block 3: 지시문 ... -->
    <rect x="285" y="120" width="510" height="50" rx="8" fill="#E8F1F5" stroke="#4C72B0" stroke-width="2"/>
    <text x="540" y="151" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#2D3748" text-anchor="middle">지시문 ...</text>

    <!-- block 4: &lt;|im_end|&gt; -->
    <rect x="805" y="120" width="125" height="50" rx="8" fill="#D0E1F9" stroke="#4C72B0" stroke-width="2"/>
    <text x="867" y="151" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" fill="#2B2D42" text-anchor="middle">&lt;|im_end|&gt;</text>
  </g>

  <!-- ROW 2: User (Light Green Theme) -->
  <g id="row-user">
    <!-- Row Label -->
    <rect x="30" y="195" width="85" height="30" rx="6" fill="#55A868"/>
    <text x="72" y="216" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">User</text>

    <!-- Row 2 Token Blocks -->
    <!-- block 1: &lt;|im_start|&gt; -->
    <rect x="30" y="235" width="120" height="50" rx="8" fill="#D1E7DD" stroke="#55A868" stroke-width="2"/>
    <text x="90" y="266" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" fill="#198754" text-anchor="middle">&lt;|im_start|&gt;</text>

    <!-- block 2: user -->
    <rect x="157" y="235" width="70" height="50" rx="8" fill="#A3E4D7" stroke="#55A868" stroke-width="2"/>
    <text x="192" y="266" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" fill="#0E6655" text-anchor="middle">user</text>

    <!-- block 3: &lt;|vision_start|&gt; -->
    <rect x="234" y="235" width="135" height="50" rx="8" fill="#D1E7DD" stroke="#55A868" stroke-width="2"/>
    <text x="301" y="266" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" fill="#198754" text-anchor="middle">&lt;|vision_start|&gt;</text>

    <!-- block 4: &lt;|image_pad|&gt; × N (사진) -->
    <rect x="376" y="235" width="200" height="50" rx="8" fill="#A2D9CE" stroke="#55A868" stroke-width="2"/>
    <text x="476" y="266" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#0B5345" text-anchor="middle">&lt;|image_pad|&gt; × N (사진)</text>

    <!-- block 5: &lt;|vision_end|&gt; -->
    <rect x="583" y="235" width="130" height="50" rx="8" fill="#D1E7DD" stroke="#55A868" stroke-width="2"/>
    <text x="648" y="266" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" fill="#198754" text-anchor="middle">&lt;|vision_end|&gt;</text>

    <!-- block 6: 질문 + 보기 (a)(b)(c)(d) -->
    <rect x="720" y="235" width="118" height="50" rx="8" fill="#E8F8F5" stroke="#55A868" stroke-width="2"/>
    <text x="779" y="266" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" fill="#117A65" text-anchor="middle">질문 + 보기</text>

    <!-- block 7: &lt;|im_end|&gt; -->
    <rect x="845" y="235" width="100" height="50" rx="8" fill="#D1E7DD" stroke="#55A868" stroke-width="2"/>
    <text x="895" y="266" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" fill="#198754" text-anchor="middle">&lt;|im_end|&gt;</text>
  </g>

  <!-- ROW 3: Assistant (Orange/Red Theme) -->
  <g id="row-assistant">
    <!-- Row Label -->
    <rect x="30" y="310" width="105" height="30" rx="6" fill="#DD8452"/>
    <text x="82" y="331" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Assistant</text>

    <!-- Row 3 Token Blocks -->
    <!-- block 1: &lt;|im_start|&gt; -->
    <rect x="30" y="350" width="135" height="50" rx="8" fill="#FFE5D9" stroke="#DD8452" stroke-width="2"/>
    <text x="97" y="381" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" fill="#7B2CBF" text-anchor="middle">&lt;|im_start|&gt;</text>

    <!-- block 2: assistant -->
    <rect x="175" y="350" width="110" height="50" rx="8" fill="#FFCAD4" stroke="#DD8452" stroke-width="2"/>
    <text x="230" y="381" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" fill="#9D0208" text-anchor="middle">assistant</text>

    <!-- Highlighted Target Region Background -->
    <rect x="295" y="342" width="225" height="66" rx="10" fill="#FFF5F5" stroke="#C44E52" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- block 3: Highlighted block "b" -->
    <rect x="305" y="350" width="80" height="50" rx="8" fill="#C44E52" stroke="#9B1D20" stroke-width="2"/>
    <text x="345" y="382" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">b</text>

    <!-- block 4: &lt;|im_end|&gt; -->
    <rect x="395" y="350" width="115" height="50" rx="8" fill="#F8AD9D" stroke="#C44E52" stroke-width="2"/>
    <text x="452" y="381" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="bold" fill="#6B1111" text-anchor="middle">&lt;|im_end|&gt;</text>
  </g>

  <!-- Bracket and Annotation Under Row 3 -->
  <g id="annotation">
    <!-- Custom Bracket SVG Path covering block "b" and "&lt;|im_end|&gt;" (X: 305 to 510) -->
    <path d="M 305 420 
             L 305 432 
             Q 305 437 407.5 437 
             L 407.5 447 
             L 407.5 437 
             Q 510 437 510 432 
             L 510 420" 
          fill="none" stroke="#C44E52" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Pointer arrow below bracket tip -->
    <polygon points="407.5,450 402,442 413,442" fill="#C44E52"/>

    <!-- Highlighted Label Box -->
    <rect x="282" y="456" width="251" height="42" rx="8" fill="#C44E52"/>
    <text x="407.5" y="483" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">모델이 배워야 할 부분</text>
  </g>
</svg>